import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'java'
    id 'idea'
}

group = 'com.example.avoidmod'
version = project.properties.version

repositories {
    mavenCentral()

    flatDir {
        dirs "libs"
    }
}

apply from: rootProject.file("build_avoid.gradle")

base {
    archivesName = project.properties.jar_name
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation "pl.olafcio:avoid:${project.properties.avoid_version}"

    compileOnly "org.joml:joml:1.10.8"
    compileOnly "org.jetbrains:annotations:20.1.0"
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    inputs.property "version", project.version

    filteringCharset "UTF-8"
    filesMatching(["avoid.mod.json"]) {
        expand inputs.properties
    }
}

tasks.jar.doLast {
    var path = tasks.jar.archiveFile.get().asFile.toPath()
    var str = path.toString().split("/").last()

    Files.move(path, path.getParent().resolve(str.substring(0, str.length() - 4) + ".avoid.zip"), StandardCopyOption.REPLACE_EXISTING)
}

def targetJavaVersion = Integer.parseInt((String) project.property("java_version"))

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.

    it.options.encoding = "UTF-8"

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)

    if (System.getProperty("gen_sources") != null)
        withSourcesJar()
}

test {
    useJUnitPlatform()
}
